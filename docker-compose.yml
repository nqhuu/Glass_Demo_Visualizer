services:
  mysql:
    image: mysql:8.4
    container_name: glass-demo-visualizer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: glass_demo_visualizer
      MYSQL_USER: glass_app
      MYSQL_PASSWORD: glass_app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
